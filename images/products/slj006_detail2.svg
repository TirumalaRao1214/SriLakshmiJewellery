<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#1a1816"/>
            <stop offset="100%" stop-color="#080706"/>
        </radialGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="35%" stop-color="#d4af37"/>
            <stop offset="70%" stop-color="#996515"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <linearGradient id="pendantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef9c3"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#78350f"/>
        </linearGradient>
        <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
        </filter>
        <pattern id="luxuryPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.12"/>
            <circle cx="20" cy="20" r="1.5" fill="#d4af37" opacity="0.15"/>
        </pattern>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="500" height="500" fill="url(#bgGrad)"/>
    <!-- Subtle Pattern overlay -->
    <rect width="500" height="500" fill="url(#luxuryPattern)"/>
    
    <!-- Inner Fine Border -->
    <rect x="20" y="20" width="460" height="460" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="12,6" opacity="0.4"/>
    <rect x="26" y="26" width="448" height="448" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Corner Ornaments -->
    <g stroke="#d4af37" stroke-width="1" fill="none" opacity="0.6">
        <path d="M 30 50 L 50 30 M 30 30 L 55 30 M 30 30 L 30 55"/>
        <path d="M 470 50 L 450 30 M 470 30 L 445 30 M 470 30 L 470 55"/>
        <path d="M 30 450 L 50 470 M 30 470 L 55 470 M 30 470 L 30 445"/>
        <path d="M 470 450 L 450 470 M 470 470 L 445 470 M 470 470 L 470 445"/>
    </g>

    <!-- Jewellery Illustration -->
    <g id="jewelleryAsset">
        
        <!-- Grand Bridal Composition -->
        <!-- Grand Choker -->
        <path d="M 140 140 Q 250 220 360 140" fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#dropGlow)"/>
        <path d="M 140 140 Q 250 220 360 140" fill="none" stroke="#901a1e" stroke-width="4" stroke-dasharray="6,8"/>
        <!-- Long Haram -->
        <path d="M 110 150 Q 250 360 390 150" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
        <path d="M 115 150 Q 250 350 385 150" fill="none" stroke="#0f5132" stroke-width="2" stroke-dasharray="8,10"/>
        <!-- Grand Pendant -->
        <g transform="translate(250, 320)">
            <circle cx="0" cy="0" r="38" fill="url(#pendantGrad)" stroke="#e6ca65" stroke-width="2"/>
            <circle cx="0" cy="0" r="26" fill="#901a1e"/>
            <!-- Lakshmi Silhouette / Motif -->
            <polygon points="0,-18 14,0 0,18 -14,0" fill="#e6ca65"/>
            <circle cx="0" cy="-6" r="5" fill="#fef08a"/>
            <!-- Hanging Pearls fringe -->
            <circle cx="-28" cy="36" r="4.5" fill="#fff9eb"/>
            <circle cx="-14" cy="42" r="5" fill="#fff9eb"/>
            <circle cx="0" cy="45" r="6" fill="#fff9eb"/>
            <circle cx="14" cy="42" r="5" fill="#fff9eb"/>
            <circle cx="28" cy="36" r="4.5" fill="#fff9eb"/>
        </g>
        <!-- Maang Tikka top -->
        <g transform="translate(250, 80)">
            <line x1="0" y1="-30" x2="0" y2="20" stroke="#e6ca65" stroke-width="2"/>
            <circle cx="0" cy="26" r="14" fill="#901a1e" stroke="#e6ca65" stroke-width="1.5"/>
            <circle cx="0" cy="26" r="7" fill="#fff9eb"/>
        </g>
        
    </g>
    
    <!-- Bottom Brand & Label Ribbon -->
    <rect x="50" y="405" width="400" height="55" rx="6" fill="#181513" opacity="0.85" stroke="#d4af37" stroke-width="1"/>
    <text x="250" y="428" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="600" fill="#f8f5ee" letter-spacing="2.5">GUTTAPUSALU GRAND SET (BACK CLASP & POLISH)</text>
    <text x="250" y="446" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10" font-weight="400" fill="#d4af37" letter-spacing="3.5">AUTHENTIC FINISH</text>
</svg>