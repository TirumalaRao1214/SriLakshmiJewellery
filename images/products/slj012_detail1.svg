<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#281d15"/>
            <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a"/>
            <stop offset="35%" stop-color="#d4af37"/>
            <stop offset="70%" stop-color="#996515"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <linearGradient id="pendantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef9c3"/>
            <stop offset="50%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#78350f"/>
        </linearGradient>
        <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
        </filter>
        <pattern id="luxuryPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 40 20 L 20 40 L 0 20 Z" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.12"/>
            <circle cx="20" cy="20" r="1.5" fill="#d4af37" opacity="0.15"/>
        </pattern>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="500" height="500" fill="url(#bgGrad)"/>
    <!-- Subtle Pattern overlay -->
    <rect width="500" height="500" fill="url(#luxuryPattern)"/>
    
    <!-- Inner Fine Border -->
    <rect x="20" y="20" width="460" height="460" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="12,6" opacity="0.4"/>
    <rect x="26" y="26" width="448" height="448" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.3"/>
    
    <!-- Corner Ornaments -->
    <g stroke="#d4af37" stroke-width="1" fill="none" opacity="0.6">
        <path d="M 30 50 L 50 30 M 30 30 L 55 30 M 30 30 L 30 55"/>
        <path d="M 470 50 L 450 30 M 470 30 L 445 30 M 470 30 L 470 55"/>
        <path d="M 30 450 L 50 470 M 30 470 L 55 470 M 30 470 L 30 445"/>
        <path d="M 470 450 L 450 470 M 470 470 L 445 470 M 470 470 L 470 445"/>
    </g>

    <!-- Jewellery Illustration -->
    <g id="jewelleryAsset">
        
        <!-- Necklace curve -->
        <path d="M 120 180 Q 250 350 380 180" fill="none" stroke="#d4af37" stroke-width="6" stroke-linecap="round"/>
        <path d="M 140 180 Q 250 320 360 180" fill="none" stroke="#e6ca65" stroke-width="2" stroke-dasharray="4,6"/>
        <!-- Center locket/pendant -->
        <g transform="translate(250, 310)">
            <circle cx="0" cy="0" r="32" fill="url(#pendantGrad)" stroke="#fff" stroke-width="1.5" filter="url(#dropGlow)"/>
            <circle cx="0" cy="0" r="20" fill="#901a1e"/>
            <polygon points="0,-14 12,0 0,14 -12,0" fill="#e6ca65"/>
            <!-- Hanging pearl drop -->
            <path d="M 0 32 C -8 45, 8 45, 0 58 C -4 48, -4 40, 0 32" fill="#fff9eb" stroke="#d4af37" stroke-width="1"/>
            <circle cx="-16" cy="24" r="5" fill="#fff9eb"/>
            <circle cx="16" cy="24" r="5" fill="#fff9eb"/>
        </g>
        <!-- Motifs on chain -->
        <circle cx="170" cy="225" r="8" fill="#901a1e" stroke="#e6ca65" stroke-width="1.5"/>
        <circle cx="330" cy="225" r="8" fill="#901a1e" stroke="#e6ca65" stroke-width="1.5"/>
        <circle cx="205" cy="270" r="10" fill="#0f5132" stroke="#e6ca65" stroke-width="1.5"/>
        <circle cx="295" cy="270" r="10" fill="#0f5132" stroke="#e6ca65" stroke-width="1.5"/>
        
    </g>
    
    <!-- Bottom Brand & Label Ribbon -->
    <rect x="50" y="405" width="400" height="55" rx="6" fill="#181513" opacity="0.85" stroke="#d4af37" stroke-width="1"/>
    <text x="250" y="428" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="600" fill="#f8f5ee" letter-spacing="2.5">MANGO MOTIF HARAM (MACRO CLOSE-UP)</text>
    <text x="250" y="446" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10" font-weight="400" fill="#d4af37" letter-spacing="3.5">ARTISAN DETAILING</text>
</svg>