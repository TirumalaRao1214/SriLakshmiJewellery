<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="100%" height="100%">
    <defs>
        <linearGradient id="bridalBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2d0a14"/>
            <stop offset="50%" stop-color="#4a121e"/>
            <stop offset="100%" stop-color="#19050b"/>
        </linearGradient>
        <linearGradient id="bridalGold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="30%" stop-color="#fef08a"/>
            <stop offset="70%" stop-color="#d4af37"/>
            <stop offset="100%" stop-color="#92400e"/>
        </linearGradient>
    </defs>
    
    <rect width="1600" height="700" fill="url(#bridalBg)"/>
    
    <!-- Delicate Arches -->
    <path d="M 0 350 Q 800 -100 1600 350" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.2"/>
    <path d="M 0 420 Q 800 -30 1600 420" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="12,12" opacity="0.25"/>
    
    <!-- Central Grand Ensemble Graphic -->
    <g transform="translate(800, 320)">
        <circle cx="0" cy="0" r="220" fill="#20070e" opacity="0.7" stroke="#d4af37" stroke-width="1"/>
        
        <!-- Multi-strand Guttapusalu necklace -->
        <path d="M -160 -80 Q 0 140 160 -80" fill="none" stroke="url(#bridalGold)" stroke-width="10"/>
        <path d="M -140 -80 Q 0 110 140 -80" fill="none" stroke="#901a1e" stroke-width="4" stroke-dasharray="6,8"/>
        
        <!-- Pearly bunches around circumference -->
        <circle cx="-120" cy="-20" r="7" fill="#fff9eb"/>
        <circle cx="-80" cy="35" r="7" fill="#fff9eb"/>
        <circle cx="-40" cy="70" r="7" fill="#fff9eb"/>
        <circle cx="0" cy="85" r="9" fill="#fff9eb"/>
        <circle cx="40" cy="70" r="7" fill="#fff9eb"/>
        <circle cx="80" cy="35" r="7" fill="#fff9eb"/>
        <circle cx="120" cy="-20" r="7" fill="#fff9eb"/>

        <!-- Vaddanam Waist Belt Silhouette Below -->
        <path d="M -150 130 Q 0 160 150 130" fill="none" stroke="url(#bridalGold)" stroke-width="8"/>
        <circle cx="0" cy="145" r="14" fill="#901a1e" stroke="#fef08a" stroke-width="1.5"/>
    </g>
    
    <text x="800" y="580" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="600" fill="#d4af37" letter-spacing="6">THE BRIDAL HERITAGE COLLECTION</text>
    <text x="800" y="615" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="12" font-weight="400" fill="#e2d9cc" letter-spacing="4">CRAFTED FOR YOUR MOST SACRED OCCASIONS</text>
</svg>